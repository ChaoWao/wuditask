    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">W</span>
        <div>
          <h1>WudiTask</h1>
          <p>GitHub work and personal coordination</p>
        </div>
      </div>
      <div class="site-navigation">
        <nav class="site-nav site-nav-info" aria-label="Learn about WudiTask">
          <a class="is-active" href="workflow.html" aria-current="page">Workflow</a>

        </nav>
      </div>
    </header>

    <main id="main-content" class="document-shell workflow-shell">
      <article class="document-card workflow-document">
        <header class="markdown-body workflow-intro">
          <h1>WudiTask workflow</h1>
          <p>GitHub records the work; one skill coordinates your execution across machines.</p>
        </header>
        <figure class="workflow-map" aria-labelledby="workflow-map-title">
          <h2 id="workflow-map-title">End-to-end task lifecycle</h2>
          <ol class="workflow-stage-track" aria-label="Main lifecycle path">
            <li data-stage="define">GitHub goal and owner</li>
            <li data-stage="align">User and agent align scope</li>
            <li data-stage="claim">Acquire or explicitly take over</li>
            <li data-stage="implement">Repository skill: plan and implement</li>
            <li data-stage="deliver">Repository workflow: validate and deliver PR</li>
            <li data-stage="finish">Save checkpoint and finish execution</li>
          </ol>
          <figcaption>Business status comes from GitHub. Execution records do not gate the business DAG.</figcaption>
        </figure>
        <div class="markdown-body workflow-notes">
<!-- WUDITASK_WORKFLOW_CONTENT -->
        </div>
      </article>
    </main>

    <footer>
