<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>GitHub 工作总览 · WudiTask</title>
    <link rel="stylesheet" href="github.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳到工作图</a>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">W</span>
        <div><strong>WudiTask</strong><span>GitHub 工作总览</span></div>
      </div>
      <button id="refresh" type="button" title="读取最近发布的快照">
        刷新
      </button>
    </header>
    <main id="main">
      <section class="health" aria-label="同步状态">
        <strong id="health" role="status">正在读取…</strong>
      </section>
      <div class="toolbar">
        <nav class="scope-tabs" aria-label="工作范围">
          <button
            type="button"
            class="scope-tab active"
            data-scope="main"
            aria-pressed="true"
          >
            重点工作 <span class="scope-count"></span>
          </button>
          <button
            type="button"
            class="scope-tab"
            data-scope="other"
            aria-pressed="false"
          >
            其他工作 <span class="scope-count"></span>
          </button>
        </nav>
        <label
          >仓库<select id="repo">
            <option value="">全部仓库</option>
          </select></label
        >
        <label
          >负责人<select id="owner">
            <option value="">全部负责人</option>
          </select></label
        >
        <label
          >状态<select id="state">
            <option value="active" selected>未完成</option>
            <option value="">全部状态</option>
            <option value="open">Open</option>
            <option value="closed">Closed</option>
            <option value="merged">Merged</option>
            <option value="unknown">未知 / 受限</option>
          </select></label
        >
        <label class="search"
          >查找<input
            id="search"
            type="search"
            placeholder="标题 / 仓库 / 编号"
        /></label>
      </div>
      <div id="tree-controls" class="tree-controls">
        <button id="expand-all" type="button" disabled>全部展开</button>
        <button id="collapse-all" type="button" disabled>全部收起</button>
      </div>
      <p id="caption" class="muted"></p>
      <div class="workspace">
        <section class="canvas-panel" aria-label="关系图">
          <div id="dag-zoom" class="zoom">
            <button id="zoom-out" type="button" aria-label="缩小">−</button>
            <button id="zoom-in" type="button" aria-label="放大">＋</button>
            <button id="zoom-fit" type="button">适应宽度</button>
          </div>
          <div id="graph" tabindex="0" aria-label="可滚动关系图"></div>
        </section>
        <aside id="details" aria-live="polite">
          <h2>选择一个任务</h2>
          <p>点击节点或表格中的任务，查看目标、当前进展、剩余工作和下一步。</p>
        </aside>
      </div>
      <details open class="table-panel">
        <summary>列表查看</summary>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>任务</th>
                <th>负责人</th>
                <th>业务状态</th>
                <th>前置条件</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </details>
      <details class="diagnostics">
        <summary id="diagnostics-label">采集诊断</summary>
        <ul id="diagnostics"></ul>
      </details>
      <noscript
        ><p>
          交互图需要 JavaScript；<a href="graph.json"
            >下载带来源和时间的 JSON 快照</a
          >，或回 GitHub 查看任务。
        </p></noscript
      >
    </main>
    <footer>
      进展来自 GitHub
      <a href="graph.json">数据</a>
    </footer>
    <div id="node-summary" class="node-summary" role="tooltip" hidden></div>
    <script src="github.js"></script>
  </body>
</html>
